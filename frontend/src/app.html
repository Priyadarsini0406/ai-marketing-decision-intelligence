<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Apply the stored theme before first paint so a refresh never shows
			// the wrong palette. Kept in sync with src/lib/theme.svelte.ts.
			try {
				if (localStorage.getItem('di-theme') === 'light') {
					document.documentElement.classList.add('di-light');
					document.documentElement.style.colorScheme = 'light';
				} else {
					document.documentElement.style.colorScheme = 'dark';
				}
			} catch (error) {
				document.documentElement.style.colorScheme = 'dark';
			}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
