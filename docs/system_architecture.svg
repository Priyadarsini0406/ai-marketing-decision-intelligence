<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">AI Marketing Decision Intelligence Project Architecture</title>
  <desc id="desc">Browser users access the SvelteKit client, which calls authenticated FastAPI services. The API reads and writes SQLite or configured PostgreSQL data and uses saved machine-learning artifacts for prediction, explanations and segmentation. Offline training consumes the supplied CSV dataset.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.section{font-size:15px;font-weight:700;letter-spacing:.5px}.head{font-size:17px;font-weight:700}.body{font-size:13px;fill:#334155}.small{font-size:12px;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:1.7}.soft{stroke-width:1.6}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.bi{fill:none;stroke:#334155;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow);stroke-linecap:round}.label{font-size:11px;font-weight:600;fill:#475569}
    </style>
  </defs>
  <rect width="1440" height="960" fill="#fff"/>
  <rect x="2" y="2" width="1436" height="956" fill="none" stroke="#222" stroke-width="2"/>
  <text x="720" y="38" text-anchor="middle" class="title">AI MARKETING DECISION INTELLIGENCE — SYSTEM ARCHITECTURE</text>
  <line x1="2" y1="54" x2="1438" y2="54" stroke="#222" stroke-width="1.5"/>

  <!-- Client access -->
  <text x="185" y="82" text-anchor="middle" class="section">CLIENT ACCESS</text>
  <rect x="25" y="96" width="320" height="250" rx="8" fill="#f8fafc" stroke="#475569" class="soft"/>
  <text x="185" y="123" text-anchor="middle" class="head">Web Browser</text>
  <text x="185" y="145" text-anchor="middle" class="body">Desktop · laptop · tablet · mobile</text>
  <rect x="52" y="166" width="266" height="91" rx="6" class="box"/>
  <text x="185" y="193" text-anchor="middle" class="head">SvelteKit User Interface</text>
  <text x="185" y="216" text-anchor="middle" class="body">Login and role-based workspaces</text>
  <text x="185" y="237" text-anchor="middle" class="body">Leads · analytics · predictions · reports</text>
  <rect x="52" y="274" width="266" height="48" rx="6" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="185" y="295" text-anchor="middle" class="body">Marketing user / student / administrator</text>
  <text x="185" y="313" text-anchor="middle" class="small">Browser-based access; no local Python required</text>

  <!-- Application server -->
  <text x="720" y="82" text-anchor="middle" class="section">APPLICATION / API LAYER</text>
  <rect x="385" y="96" width="670" height="418" rx="8" fill="#f0fdfa" stroke="#0f766e" class="soft"/>
  <text x="720" y="124" text-anchor="middle" class="head">Application Host (local development or deployed server)</text>
  <rect x="419" y="151" width="602" height="87" rx="6" class="box"/>
  <text x="720" y="179" text-anchor="middle" class="head">SvelteKit Frontend Server</text>
  <text x="720" y="202" text-anchor="middle" class="body">Serves web interface · proxies /api requests to FastAPI</text>
  <text x="720" y="222" text-anchor="middle" class="small">Development URL: 127.0.0.1:5173</text>
  <rect x="419" y="270" width="602" height="105" rx="6" class="box"/>
  <text x="720" y="298" text-anchor="middle" class="head">FastAPI Backend (Uvicorn)</text>
  <text x="720" y="321" text-anchor="middle" class="body">Authentication and roles · validation · API endpoints</text>
  <text x="720" y="343" text-anchor="middle" class="body">Leads · datasets · analytics · budget scenarios · admin</text>
  <text x="720" y="363" text-anchor="middle" class="small">Development API: 127.0.0.1:8000</text>
  <rect x="419" y="407" width="602" height="79" rx="6" fill="#fff" stroke="#99f6e4"/>
  <text x="720" y="435" text-anchor="middle" class="head">Decision and ML Services</text>
  <text x="720" y="458" text-anchor="middle" class="body">XGBoost scoring · SHAP explanations · K-Means segments</text>
  <text x="720" y="477" text-anchor="middle" class="small">Historical channel analysis · linear budget scenarios · rule-based recommendations</text>

  <!-- Storage -->
  <text x="1225" y="82" text-anchor="middle" class="section">DATA &amp; MODEL STORAGE</text>
  <rect x="1090" y="96" width="325" height="418" rx="8" fill="#f0fdf4" stroke="#15803d" class="soft"/>
  <rect x="1120" y="132" width="265" height="157" rx="6" class="box"/>
  <text x="1252" y="160" text-anchor="middle" class="head">Application Database</text>
  <text x="1252" y="184" text-anchor="middle" class="body">SQLite (default local setup)</text>
  <text x="1252" y="205" text-anchor="middle" class="body">PostgreSQL (optional via DATABASE_URL)</text>
  <text x="1252" y="236" text-anchor="middle" class="small">Accounts · sessions · leads · predictions</text>
  <text x="1252" y="256" text-anchor="middle" class="small">Datasets · configuration · channel metrics</text>
  <text x="1252" y="276" text-anchor="middle" class="small">Budget simulations · user preferences</text>
  <rect x="1120" y="324" width="265" height="145" rx="6" class="box"/>
  <text x="1252" y="352" text-anchor="middle" class="head">Model Artifacts &amp; Uploads</text>
  <text x="1252" y="377" text-anchor="middle" class="body">Saved model and metadata files</text>
  <text x="1252" y="399" text-anchor="middle" class="body">CSV/ZIP datasets and report data</text>
  <text x="1252" y="430" text-anchor="middle" class="small">Stored locally or on configured host storage</text>
  <text x="1252" y="451" text-anchor="middle" class="small">Uploads do not automatically train or import leads</text>

  <!-- Flows -->
  <path class="flow" d="M345 207 H414"/><text x="380" y="195" text-anchor="middle" class="label">HTTPS / HTTP</text>
  <path class="flow" d="M720 238 V263"/><text x="770" y="255" class="label">API requests</text>
  <path class="bi" d="M1022 322 H1113"/><text x="1067" y="308" text-anchor="middle" class="label">Read / write</text>
  <path class="bi" d="M1022 447 H1113"/><text x="1067" y="435" text-anchor="middle" class="label">Load artifacts</text>
  <path class="flow" d="M419 445 H365 V387 H185 V352"/><text x="280" y="377" text-anchor="middle" class="label">Results to dashboard</text>

  <!-- Offline model and data preparation -->
  <text x="720" y="550" text-anchor="middle" class="section">OFFLINE DATA PREPARATION &amp; MODEL WORKFLOW</text>
  <rect x="45" y="570" width="330" height="130" rx="7" fill="#fff7ed" stroke="#c2410c" class="soft"/>
  <text x="210" y="600" text-anchor="middle" class="head">Source Marketing / Lead Data</text>
  <text x="210" y="626" text-anchor="middle" class="body">Supplied CSV dataset and prepared records</text>
  <text x="210" y="649" text-anchor="middle" class="body">Optional user CSV/ZIP uploads for review</text>
  <text x="210" y="675" text-anchor="middle" class="small">Training/import is run explicitly by an operator</text>
  <rect x="485" y="570" width="470" height="130" rx="7" fill="#f5f3ff" stroke="#7c3aed" class="soft"/>
  <text x="720" y="600" text-anchor="middle" class="head">Python Data &amp; Model Pipeline</text>
  <text x="720" y="626" text-anchor="middle" class="body">Pandas / NumPy preprocessing · scikit-learn / XGBoost</text>
  <text x="720" y="649" text-anchor="middle" class="body">Model evaluation · SHAP explainer · K-Means segmentation</text>
  <text x="720" y="675" text-anchor="middle" class="small">Training command creates saved artifacts for backend inference</text>
  <rect x="1065" y="570" width="330" height="130" rx="7" fill="#eff6ff" stroke="#2563eb" class="soft"/>
  <text x="1230" y="600" text-anchor="middle" class="head">Persisted Outputs</text>
  <text x="1230" y="626" text-anchor="middle" class="body">Conversion model and metadata</text>
  <text x="1230" y="649" text-anchor="middle" class="body">Lead scores · explanations · segments</text>
  <text x="1230" y="675" text-anchor="middle" class="small">Analytics and decision-support results</text>
  <path class="flow" d="M375 635 H477"/><text x="426" y="622" text-anchor="middle" class="label">CSV input</text>
  <path class="flow" d="M955 635 H1057"/><text x="1006" y="622" text-anchor="middle" class="label">Artifacts / results</text>
  <path class="flow" d="M1230 570 V529 H1252 V477"/><text x="1309" y="540" class="label">Model files</text>

  <!-- Functional flow -->
  <rect x="45" y="735" width="1350" height="190" rx="8" fill="#f8fafc" stroke="#475569" class="soft"/>
  <text x="720" y="765" text-anchor="middle" class="section">USER FUNCTIONALITY FLOW</text>
  <g text-anchor="middle">
    <rect x="75" y="800" width="170" height="66" rx="7" class="box"/><text x="160" y="829" class="head">Register / Login</text><text x="160" y="850" class="small">Role-based access</text>
    <rect x="295" y="800" width="170" height="66" rx="7" class="box"/><text x="380" y="829" class="head">Manage Data</text><text x="380" y="850" class="small">Leads and datasets</text>
    <rect x="515" y="800" width="170" height="66" rx="7" class="box"/><text x="600" y="829" class="head">Analyze Leads</text><text x="600" y="850" class="small">Scores and segments</text>
    <rect x="735" y="800" width="170" height="66" rx="7" class="box"/><text x="820" y="829" class="head">Review Insights</text><text x="820" y="850" class="small">SHAP and reports</text>
    <rect x="955" y="800" width="170" height="66" rx="7" class="box"/><text x="1040" y="829" class="head">Plan Campaigns</text><text x="1040" y="850" class="small">Channels and budgets</text>
    <rect x="1175" y="800" width="170" height="66" rx="7" class="box"/><text x="1260" y="829" class="head">Export / Decide</text><text x="1260" y="850" class="small">Human decision support</text>
  </g>
  <path class="flow" d="M245 833 H287"/><path class="flow" d="M465 833 H507"/><path class="flow" d="M685 833 H727"/><path class="flow" d="M905 833 H947"/><path class="flow" d="M1125 833 H1167"/>
  <text x="720" y="901" text-anchor="middle" class="small">Budget estimates use historical efficiency assumptions; recommendations and projections support human review.</text>
</svg>
