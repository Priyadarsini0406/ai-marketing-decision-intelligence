<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img" aria-labelledby="title desc">
  <title id="title">Decision-Intel System Architecture</title>
  <desc id="desc">A layered architecture showing the user interface, API, data, machine-learning services, analytics, and decision-support outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700;letter-spacing:-.35px}.subtitle{font-size:14px;fill:#64748b}
      .label{font-size:11px;font-weight:700;letter-spacing:1.1px;fill:#64748b}.card{stroke-width:1.5}.cardtitle{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.small{font-size:12px;fill:#64748b}.inverse{fill:#fff}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.tag{font-size:11px;font-weight:600}
    </style>
  </defs>
  <rect width="700" height="1080" fill="#f5f7fb"/>
  <text x="350" y="50" text-anchor="middle" class="title">Decision-Intel</text>
  <text x="350" y="76" text-anchor="middle" class="subtitle">System Architecture · Lead Conversion Decision Support</text>

  <!-- User -->
  <rect x="145" y="104" width="410" height="68" rx="15" fill="#ffffff" stroke="#dbe4f0" class="card"/>
  <circle cx="176" cy="138" r="17" fill="#eaf1ff"/><text x="176" y="144" text-anchor="middle" font-size="17" font-weight="700" fill="#315fcb">U</text>
  <text x="205" y="135" class="cardtitle">User / Marketing Staff</text><text x="205" y="156" class="body">Reviews leads and plans campaigns</text>
  <path class="arrow" d="M350 172 V198"/><text x="403" y="190" class="small">HTTPS</text>

  <!-- Presentation -->
  <rect x="55" y="201" width="590" height="119" rx="17" fill="#eef4ff" stroke="#bfd1ff" class="card"/>
  <text x="78" y="226" class="label" fill="#315fcb">PRESENTATION LAYER</text>
  <rect x="78" y="239" width="544" height="61" rx="11" fill="#ffffff" stroke="#d7e3ff"/>
  <text x="98" y="265" class="cardtitle">SvelteKit Frontend</text><text x="98" y="286" class="body">Dashboard for predictions, explanations, segments and analytics</text>
  <path class="arrow" d="M350 320 V347"/><text x="394" y="339" class="small">REST API</text>

  <!-- Application -->
  <rect x="55" y="350" width="590" height="125" rx="17" fill="#ecfbfa" stroke="#b8e8e2" class="card"/>
  <text x="78" y="375" class="label" fill="#087f78">APPLICATION LAYER</text>
  <rect x="78" y="388" width="544" height="65" rx="11" fill="#ffffff" stroke="#ccece8"/>
  <text x="98" y="416" class="cardtitle">FastAPI Backend</text><text x="98" y="438" class="body">Validates requests · retrieves data · runs services · returns results</text>

  <!-- Data -->
  <path class="arrow" d="M350 475 V503"/>
  <rect x="55" y="506" width="590" height="126" rx="17" fill="#effaf3" stroke="#c9ead4" class="card"/>
  <text x="78" y="531" class="label" fill="#27834a">DATA LAYER</text>
  <rect x="78" y="544" width="544" height="68" rx="11" fill="#ffffff" stroke="#d8efdf"/>
  <text x="98" y="572" class="cardtitle">Lead Data &amp; Historical Records</text><text x="98" y="595" class="body">Leads X Education · engagement · channel conversions</text>
  <path class="arrow" d="M350 632 V661"/>

  <!-- ML services -->
  <rect x="38" y="664" width="624" height="174" rx="17" fill="#f5f0ff" stroke="#d8c9fa" class="card"/>
  <text x="61" y="689" class="label" fill="#7046b8">MACHINE-LEARNING SERVICES</text>
  <rect x="58" y="704" width="181" height="108" rx="12" fill="#ffffff" stroke="#dfd4f5"/>
  <circle cx="82" cy="730" r="13" fill="#eee7ff"/><text x="82" y="735" text-anchor="middle" font-size="11" font-weight="700" fill="#7046b8">01</text>
  <text x="103" y="735" class="cardtitle" font-size="16">XGBoost</text>
  <text x="74" y="766" class="body">Predicts conversion</text><text x="74" y="786" class="body">probability</text>
  <rect x="260" y="704" width="181" height="108" rx="12" fill="#ffffff" stroke="#dfd4f5"/>
  <circle cx="284" cy="730" r="13" fill="#eee7ff"/><text x="284" y="735" text-anchor="middle" font-size="11" font-weight="700" fill="#7046b8">02</text>
  <text x="305" y="735" class="cardtitle" font-size="16">SHAP</text>
  <text x="276" y="766" class="body">Explains factors</text><text x="276" y="786" class="body">behind each score</text>
  <rect x="462" y="704" width="181" height="108" rx="12" fill="#ffffff" stroke="#dfd4f5"/>
  <circle cx="486" cy="730" r="13" fill="#eee7ff"/><text x="486" y="735" text-anchor="middle" font-size="11" font-weight="700" fill="#7046b8">03</text>
  <text x="507" y="735" class="cardtitle" font-size="16">K-Means</text>
  <text x="478" y="766" class="body">Groups leads by</text><text x="478" y="786" class="body">engagement patterns</text>
  <path class="arrow" d="M350 838 V866"/>

  <!-- Analytics -->
  <rect x="55" y="869" width="590" height="99" rx="17" fill="#fff8e9" stroke="#f1d99e" class="card"/>
  <text x="78" y="894" class="label" fill="#a26a00">ANALYTICS &amp; PLANNING</text>
  <text x="78" y="924" class="cardtitle">Channel Insights &amp; Budget Scenarios</text>
  <text x="78" y="948" class="body">Historical summaries and illustrative allocations at constant efficiency</text>
  <path class="arrow" d="M350 968 V993"/>

  <!-- Output -->
  <rect x="55" y="996" width="590" height="69" rx="17" fill="#172b4d" stroke="#172b4d" class="card"/>
  <text x="350" y="1025" text-anchor="middle" font-size="18" font-weight="700" class="inverse">Decision-Support Dashboard</text>
  <text x="350" y="1048" text-anchor="middle" font-size="13" class="inverse">Scores · explanations · segments · channel and budget insights</text>
</svg>
